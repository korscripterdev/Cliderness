# Cliderness CI - created by korscripterdev
# Native builds + tests on Linux, macOS and Windows, a strict C90 check,
# and genuine MS-DOS executables built with Open Watcom (16-bit and DOS/4GW).
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        working-directory: build
        run: cpack -C Release
      - uses: actions/upload-artifact@v4
        with:
          name: Cliderness-${{ runner.os }}
          path: |
            build/Cliderness-*.zip
            build/Cliderness-*.tar.gz

  make-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strict ISO C90 (gcc)
        run: make strict CC=gcc
      - name: Make build and tests (clang)
        run: make test CC=clang

  dos-watcom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-watcom/setup-watcom@v0
        with:
          version: "2.0"
      - name: 16-bit real mode (large model)
        run: sh builds/dos/build_watcom.sh 16
      - name: 32-bit DOS/4GW
        run: sh builds/dos/build_watcom.sh 386
      - name: Package
        run: python3 tools/package.py --dos
      - uses: actions/upload-artifact@v4
        with:
          name: Cliderness-DOS
          path: dist/CLIDE-DOS.ZIP
